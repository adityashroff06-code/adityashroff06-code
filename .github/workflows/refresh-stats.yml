name: Refresh profile stats

# Rebuilds the "GitHub pulse" card and the contribution snake from the GitHub API
# and publishes them to the `output` branch, which README.md reads from.
# Uses only the built-in GITHUB_TOKEN; no personal token or third-party stats service.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 1 * * *"   # daily at 01:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Render GitHub pulse card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_stats.py --user "$GH_USER" --out dist

      - name: Render contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#D4B06A&color_dots=#1A1714,#3A3127,#6B5733,#9C7D3E,#D4B06A
            dist/snake-light.svg?palette=github-light&color_snake=#8A6113&color_dots=#EBEDF0,#EADFC6,#D6C08C,#B8923F,#8A6113

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Refresh profile stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
