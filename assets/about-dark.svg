<svg xmlns="http://www.w3.org/2000/svg" width="900" height="354" viewBox="0 0 900 354" role="img" aria-labelledby="t d" fill="none"><title id="t">Statement</title><desc id="d">I put data and AI to work where the result has to be defended: a packaging line, a police control room, an energy report. Every build ships with its evaluation, its limits and its reason codes. FOCUS: Computer vision on live feeds, GenAI and RAG with cited sources, Data pipelines that show coverage. HOW I WORK: Tested, CI-checked code, Docs that state their limits, Measured and estimated, labelled. BASED IN: Toronto, Canada, Digital Transformation and, AI Enablement Specialist.</desc><style>@font-face{font-family:JB5;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:IN;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:PFI;font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="900" height="354" rx="6"/></clipPath><linearGradient id="frbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15120F"/><stop offset="1" stop-color="#0C0B09"/></linearGradient></defs><g clip-path="url(#fr)"><rect width="900" height="354" fill="url(#frbg)"/><rect x="36" y="0" width="48" height="2" fill="#D4B06A"/><rect x="56.0" y="54.0" width="12" height="1.2" fill="#D4B06A"/><text x="74" y="58" font-family="JB5" font-size="11" fill="#D4B06A" text-anchor="start" letter-spacing="2.2" >STATEMENT</text><text x="55" y="106" font-family="PFI" font-size="24" fill="#F4EFE6" text-anchor="start" >I put data and AI to work where the result has to be defended: a packaging</text><text x="55" y="140" font-family="PFI" font-size="24" fill="#F4EFE6" text-anchor="start" >line, a police control room, an energy report. Every build ships with its</text><text x="55" y="174" font-famil